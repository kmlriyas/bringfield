<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO: Title & Description -->
    <title>Bringfield | Creative Agency in Dubai, UAE — Media, Branding & Digital Experiences</title>
    <meta name="description"
        content="Bringfield is Dubai's premier creative agency crafting media production, digital experiences, events, and branding. Where ideas enter the field and become reality. Based in UAE.">

    <!-- SEO: Keywords & Geo Targeting -->
    <meta name="keywords"
        content="creative agency Dubai, media production UAE, digital experiences Dubai, branding agency UAE, event production Dubai, Bringfield, creative studio Dubai, advertising agency UAE">
    <meta name="author" content="Bringfield">
    <meta name="robots" content="index, follow">
    <meta name="geo.region" content="AE-DU">
    <meta name="geo.placename" content="Dubai, United Arab Emirates">
    <meta name="language" content="en">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bringfield.ae/">
    <meta property="og:title" content="Bringfield | Creative Agency in Dubai, UAE">
    <meta property="og:description"
        content="Dubai's premier creative agency for media production, digital experiences, branding & events. Where ideas enter the field and become reality.">
    <meta property="og:image" content="https://bringfield.ae/bringfield-og-image.jpg">
    <meta property="og:locale" content="en_AE">
    <meta property="og:site_name" content="Bringfield">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@bringfield_ae">
    <meta name="twitter:title" content="Bringfield | Creative Agency in Dubai, UAE">
    <meta name="twitter:description"
        content="Dubai's premier creative agency for media production, digital experiences, branding & events.">
    <meta name="twitter:image" content="https://bringfield.ae/bringfield-og-image.jpg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://bringfield.ae/">

    <!-- Fonts: Outfit for titles, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Animation Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
</head>

<body class="is-loading">

    <!-- Curtain Loader -->
    <div class="loader" id="loader">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <div class="loader-content">
            <img src="bringfield-logo.png" alt="Bringfield" class="loader-logo">
            <div class="loader-line"></div>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Background Video (Full Screen) -->
    <div class="video-canvas-container">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="bringfield-comingsoon-video.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Header -->
    <header class="site-header">
        <nav class="nav-container">
            <div class="nav-left">
                <a href="https://instagram.com/bringfield.ae" target="_blank" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <span>bringfield.ae</span>
                </a>
            </div>
            <div class="nav-center">
                <a href="/" class="logo-link">
                    <img src="bringfield-logo.png" alt="Bringfield" class="header-logo">
                </a>
            </div>
            <div class="nav-right">
                <a href="mailto:hello@bringfield.com" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <span>hello@bringfield.com</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="smooth-content">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="container hero-container">
                <div class="hero-text">
                    <h1 class="hero-heading">
                        <span class="reveal">THE FIELD WHERE</span><br>
                        <span class="reveal">IDEAS GROW</span>
                    </h1>
                </div>
            </div>
            <div class="hero-marquee">
                <div class="marquee-inner">
                    <span>LAUNCHING SOON — BRINGFIELD UAE </span>
                    <span>LAUNCHING SOON — BRINGFIELD UAE </span>
                    <span>LAUNCHING SOON — BRINGFIELD UAE </span>
                    <span>LAUNCHING SOON — BRINGFIELD UAE </span>
                    <span>LAUNCHING SOON — BRINGFIELD UAE </span>
                </div>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
