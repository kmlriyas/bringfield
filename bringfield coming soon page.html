<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bringfield — Coming Soon</title>

<!-- Poppins Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: #0d0d0d;
  color: #ffffff;
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Fade-in animation */
@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Blinking dots animation */
@keyframes blink {
  0%, 80%, 100% { opacity: 0; }
  40% { opacity: 1; }
}

.container {
  max-width: 650px;
  padding: 20px;
}

/* Logo */
.logo {
  font-size: 70px;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeInUp 1.5s ease forwards;
  animation-delay: 0s;
}

/* Tagline */
.tagline {
  font-size: 22px;
  font-weight: 400;
  line-height: 1.4;
  margin-bottom: 70px;
  opacity: 0;
  animation: fadeInUp 1.5s ease forwards;
  animation-delay: 0.5s; /* starts shortly after logo */
}

/* Brand Statement */
.brand-statement {
  font-size: 15px;
  font-weight: 300;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.85);
  margin: 0 auto 70px; /* spacing to COMING SOON */
  opacity: 0;
  animation: fadeInUp 1.5s ease forwards;
  animation-delay: 1.5s; /* new delay */
  max-width: 600px;
}

.brand-statement span {
  display: block;
  text-align: center;
}

/* Coming Soon */
.coming-soon {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 8px;
  color: #ffffff;
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeInUp 1.5s ease forwards;
  animation-delay: 2.5s; /* new delay */
}

.coming-soon span.dot {
  opacity: 0;
  animation: blink 1.5s infinite;
}

.coming-soon span.dot:nth-child(1) { animation-delay: 2.5s; }
.coming-soon span.dot:nth-child(2) { animation-delay: 2.7s; }
.coming-soon span.dot:nth-child(3) { animation-delay: 2.9s; }

/* Footer */
.footer {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 1px;
  opacity: 0;
  animation: fadeInUp 1.5s ease forwards;
  animation-delay: 3.5s; /* new delay */
  margin-top: 40px;
}

/* Optional subtle background motion */
body::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.02) 0%, transparent 70%);
  animation: rotateBg 60s linear infinite;
  z-index: 0;
}

@keyframes rotateBg {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">bringfield</div>
  <div class="tagline">Where ideas enter the field and become reality.</div>

  <div class="brand-statement">
    <span>"Bringfield is a creative studio focused on media production, digital experiences, events, and branding. We bring ideas into a shared creative field where they grow and become real."</span>
  </div>

  <div class="coming-soon">
    COMING SOON<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </div>

  <div class="footer">
    © Bringfield — UAE<br>
    hello@bringfield.com
  </div>
</div>

</body>
</html>
